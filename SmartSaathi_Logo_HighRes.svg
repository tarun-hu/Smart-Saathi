<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Define the background gradient from the login screen (optional, but looks great for presentation) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A237E" />
      <stop offset="50%" stop-color="#283593" />
      <stop offset="100%" stop-color="#3949AB" />
    </linearGradient>
  </defs>

  <!-- Optional Dark Navy Gradient Background to mimic the app -->
  <rect width="1024" height="1024" fill="url(#bgGradient)" rx="200" />

  <!-- The circular container (white with 10% opacity) -->
  <circle cx="512" cy="512" r="400" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="16" />

  <!-- The Icons.health_and_safety Material Icon, centered and scaled to 55% of the container -->
  <!-- Original viewBox 0 0 24 24 mapped to fit a 440x440 size in the center:
       X = (1024 - 440) / 2 = 292
       Y = (1024 - 440) / 2 = 292
       Scale = 440 / 24 = 18.3333 
  -->
  <g transform="translate(292, 292) scale(18.3333)">
    <path fill="#ffffff" d="M10.5 13H8v-3h2.5V7.5h3V10H16v3h-2.5v2.5h-3V13z M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm6 9.09c0 4-2.55 7.7-6 8.83-3.45-1.13-6-4.82-6-8.83V6.31l6-2.12 6 2.12v4.78z"/>
  </g>
</svg>
