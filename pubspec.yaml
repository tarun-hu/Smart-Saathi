name: smart_saathi_app
description: "SmartSaathi - Voice-first elderly care companion for Indian seniors"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.12.0

  # Voice
  speech_to_text: ^7.3.0
  flutter_tts: ^3.8.5

  # Location & Communication
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  url_launcher: ^6.3.2

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Storage & Utils
  shared_preferences: ^2.3.0
  intl: ^0.20.2
  go_router: ^17.1.0
  flutter_dotenv: ^5.1.0
  google_fonts: ^8.0.2
  timezone: ^0.9.2
  flutter_timezone: ^5.0.2

  # Charts
  fl_chart: ^0.69.0

  # AI & Networking
  http: ^1.3.0

  # Camera for health reports
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
